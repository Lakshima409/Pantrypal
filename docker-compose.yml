# PantryPal — full stack (blueprint §66)
# NOTE: authored to the report's container architecture; build/test on a
# machine with Docker Desktop (not installed on the original dev machine).
# First boot: schema.sql + migrations/ + seed.sql load into a fresh MySQL
# volume automatically (docker-entrypoint-initdb.d, numbered prefixes
# enforce order).

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pantrypal_root
      MYSQL_DATABASE: recipe_db
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/add_diet_plan.sql:/docker-entrypoint-initdb.d/02-diet-plan.sql:ro
      - ./database/migrations/add_expiry_date.sql:/docker-entrypoint-initdb.d/03-expiry.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppantrypal_root"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3306:3306"

  server:
    build: ./server
    environment:
      PORT: "5000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: pantrypal_root
      DB_NAME: recipe_db
      JWT_SECRET: change-me-in-production
      CLIENT_ORIGIN: http://localhost:5173
      AI_RECOMMENDER_URL: http://recommender:5001
      AI_PLANNER_URL: http://diet-planner:5002
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  recommender:
    build: ./ai-services/recommender
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: pantrypal_root
      DB_NAME: recipe_db
      AI_RECOMMENDER_PORT: "5001"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5001:5001"

  diet-planner:
    build: ./ai-services/diet-planner
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: pantrypal_root
      DB_NAME: recipe_db
      AI_PLANNER_PORT: "5002"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5002:5002"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  db-data:
